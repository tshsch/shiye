<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾页 · 你的阅读智能体</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1c1e;--sub:#7a7a80;--accent:#4f46e5;--accent2:#eef2ff;--line:#e8e6e0;--green:#0d9488;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
.logo{font-size:22px;font-weight:700;letter-spacing:1px}.logo span{color:var(--accent)}
.badge{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
nav{margin-left:auto;display:flex;gap:6px}
nav button{border:none;background:none;padding:8px 16px;border-radius:10px;font-size:14px;color:var(--sub);cursor:pointer;font-weight:500}
nav button.on{background:var(--accent2);color:var(--accent)}
main{max-width:860px;margin:0 auto;padding:28px 20px 80px}
.hero{margin-bottom:20px}
.hero h1{font-size:26px;font-weight:700}
.hero p{color:var(--sub);margin-top:6px;font-size:14px}
.pastebox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.pastebox textarea,.pastebox input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;font-family:inherit;outline:none;background:#fbfaf8}
.pastebox textarea:focus,.pastebox input:focus{border-color:var(--accent)}
.pastebox textarea{min-height:110px;resize:vertical;margin-top:10px}
.row{display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
.btn:hover{opacity:.9}.btn.ghost{background:var(--accent2);color:var(--accent)}.btn.small{padding:6px 14px;font-size:13px}
.hint{font-size:12px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s;position:relative;display:flex;flex-direction:column;gap:8px}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.07)}
.card h3{font-size:15px;line-height:1.4}
.card .one{color:var(--sub);font-size:13px;line-height:1.5}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;background:var(--accent2);color:var(--accent);border-radius:6px;padding:2px 8px}
.meta{font-size:12px;color:var(--sub);display:flex;gap:10px;margin-top:auto}
.folder-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.folder-chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.folder-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.folder-chip .pub{font-size:10px;color:var(--green);border:1px solid var(--green);border-radius:99px;padding:0 6px}
.bookcard{background:linear-gradient(135deg,#312e81,#4f46e5);color:#fff;border:none;padding:20px;border-radius:var(--radius);cursor:pointer}
.bookcard h3{font-size:17px}.bookcard p{font-size:13px;opacity:.85;margin-top:4px}
.section{font-size:16px;font-weight:700;margin:26px 0 4px}
.empty{color:var(--sub);text-align:center;padding:50px 0;font-size:14px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 16px}
.mask.show{display:flex}
.modal{background:var(--card);border-radius:18px;max-width:640px;width:100%;padding:26px}
.modal h2{font-size:19px;margin-bottom:6px}
.modal .sum{background:#fbfaf8;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;line-height:1.7;margin:14px 0}
.modal .content{font-size:14px;line-height:1.9;color:#3a3a3c;white-space:pre-wrap;max-height:280px;overflow:auto;background:#fbfaf8;border-radius:12px;padding:14px;margin-bottom:14px}
.selrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}
select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;background:#fff}
.comment{border-top:1px solid var(--line);padding:10px 0;font-size:13px}
.comment b{font-size:13px}.comment .c-sub{color:var(--sub);font-size:11px;margin-left:8px}
.cform{display:flex;gap:8px;margin-top:10px}
.cform input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
/* chat */
.chatwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-height:380px;display:flex;flex-direction:column}
.chatlog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.bubble{max-width:85%;padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.7;white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:var(--accent);color:#fff}
.bubble.ai{align-self:flex-start;background:#fbfaf8;border:1px solid var(--line)}
.src{font-size:12px;color:var(--sub);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.chipinput{display:flex;gap:10px}
.chipinput input{flex:1;border:1px solid var(--line);border-radius:12px;padding:13px 16px;font-size:14px;outline:none}
.suggest{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.suggest button{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;color:var(--sub);cursor:pointer}
.suggest button:hover{border-color:var(--accent);color:var(--accent)}
.authmask{position:fixed;inset:0;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:none;align-items:center;justify-content:center;z-index:200}
.authmask.show{display:flex}
.authbox{background:#fff;border-radius:20px;padding:34px 30px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.authbox h1{text-align:center;font-size:24px}.authbox h1 span{color:var(--accent)}
.authbox p{text-align:center;color:var(--sub);font-size:13px;margin:6px 0 18px}
.authbox input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:10px;outline:none}
.authbox input:focus{border-color:var(--accent)}
.authbox .btn{width:100%;margin-top:4px}
.authbox .switch{text-align:center;font-size:13px;color:var(--sub);margin-top:14px}
.authbox .switch b{color:var(--accent);cursor:pointer}
.autherr{color:#dc2626;font-size:12px;text-align:center;min-height:16px;margin-bottom:6px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:99px;font-size:13px;display:none;z-index:99}
.loading{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.card{animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bubble{animation:pop .2s ease}
.note{font-size:13px;color:var(--green);background:#f0fdfa;border:1px solid #99f6e4;border-radius:10px;padding:10px 14px;margin-top:12px;display:none}
.reco{font-size:12px;color:var(--green);background:#f0fdfa;border-radius:8px;padding:6px 10px}
.del{position:absolute;top:10px;right:12px;color:#ccc;font-size:15px;cursor:pointer}.del:hover{color:#ef4444}
</style>
</head>
<body>
<header>
  <div class="logo">拾<span>页</span></div>
  <div class="badge" id="aiBadge">检测中…</div>
  <nav>
    <button data-tab="inbox" class="on">收藏夹</button>
    <button data-tab="shelf">书架</button>
    <button data-tab="square">广场</button>
    <button data-tab="chat">问收藏</button>
  </nav><span class="badge" id="userBadge" style="display:none"></span>
</header>
<main>
  <div class="hero">
    <h1>随手收藏，AI 帮你读懂、记住</h1>
    <p>粘贴文章链接或正文，10 秒生成导读卡，自动归类，还能挂到在读的书下面。</p>
  </div>
  <div class="pastebox">
    <input id="urlInput" placeholder="粘贴文章链接（微信公众号 / 知乎 / 普通网页）">
    <textarea id="textInput" placeholder="或直接粘贴正文（链接被登录墙挡住时用这个）"></textarea>
    <div class="row">
      <button class="btn" id="saveBtn" onclick="saveItem()">收进来</button>
      <span class="hint">回车即可提交正文 · 收藏后自动生成摘要与标签</span>
    </div>
    <div class="note" id="saveNote"></div>
  </div>

  <div id="tab-inbox">
    <div class="section">收藏夹</div>
    <div class="folder-strip" id="folderStrip"></div>
    <div class="grid" id="itemGrid"></div>
  </div>

  <div id="tab-shelf" style="display:none">
    <div class="section">书架 · 围绕一本书聚合所有资料</div>
    <div class="row" style="margin-top:10px">
      <input id="bookTitle" placeholder="书名，如：置身事内" style="border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;width:240px">
      <button class="btn ghost" onclick="addBook()">建一本书</button>
    </div>
    <div class="grid" id="bookGrid"></div>
    <div id="bookDetail"></div>
  </div>

  <div id="tab-square" style="display:none">
    <div class="section">广场 · 同学们的宝藏推荐</div>
    <p class="hint" style="margin-bottom:6px">把收藏夹设为公开，推荐时写一句理由，别人能看到。</p>
    <div class="grid" id="squareGrid"></div>
  </div>

  <div id="tab-chat" style="display:none">
    <div class="section">问我的收藏库</div>
    <div class="chatwrap">
      <div class="suggest" id="suggestBox"></div>
      <div class="chatlog" id="chatLog"><div class="bubble ai">你好，我是你的阅读助手。问我任何"你收藏过的内容"相关的问题，我会引用原文回答。</div></div>
      <div class="chipinput">
        <input id="chatInput" placeholder="例如：我的收藏里是怎么讲土地财政的？">
        <button class="btn" onclick="sendChat()">提问</button>
      </div>
    </div>
  </div>
</main>

<div class="mask" id="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBody"></div>
</div>
<div class="authmask" id="authMask">
  <div class="authbox">
    <h1>拾<span>页</span></h1>
    <p>随手收藏，AI 帮你读懂、记住</p>
    <div class="autherr" id="authErr"></div>
    <input id="authUser" placeholder="用户名（2-20位）">
    <input id="authPass" type="password" placeholder="密码（至少4位）">
    <button class="btn" id="authGo">登录</button>
    <div class="switch">还没有账号？<b id="authSwitch">注册一个</b></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let S = null; // state
let curFolder = 'all';
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, method, body) {
  const r = await fetch('/api/' + path, { method: method||'GET', headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined });
  const d = await r.json().catch(()=>({error:'服务器错误'}));
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',2200); }

async function refresh(){
  S = await api('state');
  $('aiBadge').textContent = S.llm ? 'AI 已连接' : '演示模式（未配置 key）';
  renderFolders(); renderItems(); renderBooks(); renderSquare(); renderSuggests();
}

// ---------- tabs ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  for (const t of ['inbox','shelf','square','chat']) $('tab-'+t).style.display = b.dataset.tab===t ? '' : 'none';
});

// ---------- save ----------
async function saveItem(){
  const url = $('urlInput').value.trim(), text = $('textInput').value.trim();
  if (!url && text.length < 30) return toast('请粘贴链接，或至少 30 字的正文');
  const btn = $('saveBtn'); btn.disabled = true; btn.innerHTML = '<span class="loading"></span>AI 正在阅读…';
  try {
    const d = await api('items','POST',{url, text});
    $('urlInput').value=''; $('textInput').value='';
    const n = $('saveNote'); n.style.display='block';
    n.textContent = '已收藏《'+d.item.title+'》，AI 生成了导读，去收藏夹看看 →';
    await refresh();
  } catch(e){ toast(e.message); }
  btn.disabled=false; btn.textContent='收进来';
}
$('textInput').addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); saveItem(); }});

// ---------- folders & items ----------
function renderFolders(){
  const strip = $('folderStrip');
  let html = `<div class="folder-chip ${curFolder==='all'?'on':''}" onclick="curFolder='all';renderFolders();renderItems()">全部</div>`;
  for (const f of S.folders){
    const cnt = S.items.filter(i=>i.folder_id===f.id).length;
    html += `<div class="folder-chip ${curFolder===f.id?'on':''}" onclick="curFolder=${f.id};renderFolders();renderItems()">${esc(f.name)} ${cnt} ${f.is_public?'<span class="pub">公开</span>':''}</div>`;
  }
  html += `<div class="folder-chip" onclick="newFolder()">＋ 新建</div>`;
  strip.innerHTML = html;
}
async function newFolder(){
  const name = prompt('收藏夹名称：'); if(!name) return;
  await api('folders','POST',{name}); refresh();
}
function visibleItems(){
  return curFolder==='all' ? S.items : S.items.filter(i=>i.folder_id===curFolder);
}
function renderItems(){
  const g = $('itemGrid'); const items = visibleItems();
  g.innerHTML = items.length ? '' : '<div class="empty" style="grid-column:1/-1">这里还空空的，先收藏一篇文章吧</div>';
  for (const it of items){
    const book = S.books.find(b=>b.id===it.book_id);
    const folder = S.folders.find(f=>f.id===it.folder_id);
    const card = document.createElement('div'); card.className='card';
    card.onclick = ()=>openItem(it.id);
    card.innerHTML = `
      <div class="del" onclick="event.stopPropagation();delItem(${it.id})">×</div>
      <h3>${esc(it.title)}</h3>
      <div class="one">${esc(it.one_sentence)}</div>
      <div class="tags">${it.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      ${it.recommend_note?`<div class="reco">💬 ${esc(it.author_name||'同学')}：${esc(it.recommend_note)}</div>`:''}
      <div class="meta"><span>约 ${it.minutes} 分钟</span>${folder?`<span>📁 ${esc(folder.name)}</span>`:''}${book?`<span>📖 ${esc(book.title)}</span>`:''}</div>`;
    g.appendChild(card);
  }
}
async function delItem(id){ if(!confirm('删除这条收藏？'))return; await api('items/'+id,'DELETE'); refresh(); }

// ---------- modal ----------
function openItem(id){
  const it = S.items.find(i=>i.id===id); if(!it) return;
  const cs = S.comments.filter(c=>c.item_id===id);
  const folderOpts = S.folders.map(f=>`<option value="${f.id}" ${f.id===it.folder_id?'selected':''}>${esc(f.name)}</option>`).join('');
  const bookOpts = '<option value="">不挂到书</option>' + S.books.map(b=>`<option value="${b.id}" ${b.id===it.book_id?'selected':''}>${esc(b.title)}</option>`).join('');
  $('modalBody').innerHTML = `
    <h2>${esc(it.title)}</h2>
    <div class="meta"><span>约 ${it.minutes} 分钟读完</span>${it.url?`<a href="${esc(it.url)}" target="_blank">原文链接</a>`:''}</div>
    <div class="sum"><b>AI 导读</b><br>${esc(it.summary)}</div>
    <div class="tags">${it.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    <div class="selrow" style="margin-top:12px">
      📁 <select id="mFolder">${folderOpts}</select>
      📖 <select id="mBook">${bookOpts}</select>
      <button class="btn small ghost" onclick="saveMeta(${id})">保存</button>
    </div>
    <details><summary style="cursor:pointer;font-size:13px;color:var(--sub)">查看正文</summary><div class="content" style="margin-top:10px">${esc(it.content)}</div></details>
    <div class="section" style="font-size:14px;margin:16px 0 4px">评论讨论</div>
    ${cs.map(c=>`<div class="comment"><b>${esc(c.user_name)}</b><span class="c-sub">${c.created_at}</span><br>${esc(c.text)}</div>`).join('') || '<div class="hint">还没有评论</div>'}
    <div class="cform">
      <input id="cname" placeholder="你的名字" style="max-width:90px">
      <input id="ctext" placeholder="写点什么…" onkeydown="if(event.key==='Enter')postComment(${id})">
      <button class="btn small" onclick="postComment(${id})">发送</button>
    </div>`;
  $('mask').classList.add('show');
}
function closeModal(){ $('mask').classList.remove('show'); }
async function saveMeta(id){
  await api('items/'+id,'PATCH',{ folder_id: $('mFolder').value || null, book_id: $('mBook').value || null });
  await refresh(); closeModal(); toast('已保存');
}
async function postComment(id){
  const name = $('cname').value.trim() || '同学', text = $('ctext').value.trim();
  if(!text) return;
  await api('comments','POST',{item_id:id,user_name:name,text});
  await refresh(); openItem(id);
}

// ---------- books ----------
async function addBook(){
  const title = $('bookTitle').value.trim(); if(!title) return toast('输入书名');
  await api('books','POST',{title}); $('bookTitle').value=''; refresh();
}
function renderBooks(){
  const g = $('bookGrid');
  g.innerHTML = S.books.length ? '' : '<div class="empty" style="grid-column:1/-1">还没有书，建一本开始聚合资料</div>';
  for (const b of S.books){
    const n = S.items.filter(i=>i.book_id===b.id).length;
    const card = document.createElement('div'); card.className='card bookcard';
    card.onclick = ()=>openBook(b.id);
    card.innerHTML = `<h3>📖 ${esc(b.title)}</h3><p>${esc(b.author||'')}${b.author?' · ':''}${n} 篇相关资料</p>`;
    g.appendChild(card);
  }
}
function openBook(id){
  const b = S.books.find(x=>x.id===id);
  const items = S.items.filter(i=>i.book_id===id);
  $('bookDetail').innerHTML = `
    <div class="section">《${esc(b.title)}》 · ${items.length} 篇资料</div>
    <p class="hint" style="margin-bottom:8px">${esc(b.note||'')}</p>
    <div class="grid">${items.map(it=>`
      <div class="card" onclick="openItem(${it.id})"><h3>${esc(it.title)}</h3><div class="one">${esc(it.one_sentence)}</div>
      <div class="tags">${it.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div>`).join('')
      || '<div class="empty">这本书下还没有资料，收藏文章后在详情里挂到这本书下</div>'}</div>`;
  $('bookDetail').scrollIntoView({behavior:'smooth'});
}

// ---------- square ----------
function renderSquare(){
  const g = $('squareGrid');
  const pubs = S.square || [];
  g.innerHTML = pubs.length ? '' : '<div class="empty" style="grid-column:1/-1">广场还很安静，把一个收藏夹设为公开试试</div>';
  for (const it of pubs){
    const mine = S.items.some(x=>x.id===it.id);
    const card = document.createElement('div'); card.className='card';
    card.onclick = ()=>openItem(it.id);
    card.innerHTML = `
      <div class="reco">💬 ${esc(it.author_name||it.owner||'同学')}：${esc(it.recommend_note||'觉得不错，分享给大家')}</div>
      <h3>${esc(it.title)}</h3>
      <div class="one">${esc(it.one_sentence)}</div>
      <div class="meta"><span>👤 ${esc(it.owner||'同学')}${mine?'（你）':''}</span><span>💬 ${it.comment_count||0} 条讨论</span><span>约 ${it.minutes} 分钟</span></div>`;
    g.appendChild(card);
  }
}

// ---------- chat ----------
const SUGGESTS = ['我的收藏里是怎么讲土地财政的？','收藏的文章怎么看待时间管理？','论文写作有什么建议？','分税制改革的影响是什么？'];
function renderSuggests(){
  $('suggestBox').innerHTML = SUGGESTS.map(s=>`<button onclick="$('chatInput').value=this.textContent;sendChat()">${s}</button>`).join('');
}
async function sendChat(){
  const q = $('chatInput').value.trim(); if(!q) return;
  $('chatInput').value='';
  const log = $('chatLog');
  log.insertAdjacentHTML('beforeend', `<div class="bubble me">${esc(q)}</div><div class="bubble ai" id="pending"><span class="loading" style="border-color:var(--accent);border-top-color:transparent"></span>正在翻你的收藏…</div>`);
  log.scrollTop = log.scrollHeight;
  try {
    const d = await api('chat','POST',{question:q});
    $('pending').outerHTML = `<div class="bubble ai">${esc(d.answer)}${d.sources.length?'<div class="src">引用：'+d.sources.map(s=>`[${s.n}] ${esc(s.title)}`).join(' · ')+'</div>':''}</div>`;
  } catch(e){ $('pending').outerHTML = `<div class="bubble ai">出错了：${esc(e.message)}</div>`; }
  log.scrollTop = log.scrollHeight;
}
$('chatInput').addEventListener('keydown', e => { if(e.key==='Enter') sendChat(); });

// ---------- auth ----------
let registering = false;
function showAuth(){ $('authMask').classList.add('show'); }
async function boot(){
  try {
    const me = await api('me');
    $('userBadge').textContent = '👋 ' + me.username;
    $('userBadge').style.display = '';
    await refresh();
  } catch(e){ showAuth(); }
}
$('authSwitch').onclick = () => {
  registering = !registering;
  $('authGo').textContent = registering ? '注册并进入' : '登录';
  $('authSwitch').textContent = registering ? '直接登录' : '注册一个';
  $('authErr').textContent = '';
};
$('authGo').onclick = async () => {
  const u = $('authUser').value.trim(), p = $('authPass').value;
  $('authErr').textContent = '';
  try {
    await api(registering ? 'register' : 'login', 'POST', { username: u, password: p });
    $('authMask').classList.remove('show');
    await boot();
  } catch(e){ $('authErr').textContent = e.message; }
};
$('authPass').addEventListener('keydown', e => { if(e.key==='Enter') $('authGo').click(); });
$('userBadge').onclick = async () => {
  if (confirm('退出登录？')) { await api('logout','POST'); location.reload(); }
};
boot();
</script>
</body>
</html>
